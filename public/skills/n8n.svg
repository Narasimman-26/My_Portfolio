<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Neon Radial Glow -->
    <radialGradient id="glow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#EA4B71" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF6D5A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Left Glow -->
    <radialGradient id="leftGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#FF6D5A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="400" height="150" fill="url(#bg)"/>
  <rect width="400" height="150" fill="url(#grid)"/>
  <rect width="400" height="150" fill="url(#glow)"/>
  <rect width="400" height="150" fill="url(#leftGlow)"/>

  <!-- Top Accent Highlight Line -->
  <line x1="0" y1="1" x2="400" y2="1" stroke="#EA4B71" stroke-width="2" opacity="0.4"/>

  <!-- Background Decorative Shapes / Code -->
  
      <!-- Flow Nodes Connected -->
      <circle cx="240" cy="75" r="12" fill="#EA4B71" opacity="0.8"/>
      <rect x="275" y="40" width="28" height="28" rx="6" fill="#FF6D5A" opacity="0.8"/>
      <circle cx="335" cy="75" r="12" fill="#EA4B71" opacity="0.8"/>
      <rect x="275" y="85" width="28" height="28" rx="6" fill="#FF6D5A" opacity="0.8"/>
      <path d="M 252 75 L 275 54" stroke="#EA4B71" stroke-width="2.5"/>
      <path d="M 252 75 L 275 99" stroke="#EA4B71" stroke-width="2.5"/>
      <path d="M 303 54 L 323 75" stroke="#FF6D5A" stroke-width="2.5"/>
      <path d="M 303 99 L 323 75" stroke="#FF6D5A" stroke-width="2.5"/>
      <text x="32" y="105" font-family="monospace" font-size="20" font-weight="bold" fill="#FB7185" opacity="0.9">webhook.trigger()</text>
    

  <!-- Tech Dots / Matrix Accents -->
  <circle cx="375" cy="20" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="385" cy="30" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="365" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="20" cy="25" r="2" fill="#EA4B71" opacity="0.6"/>
  <circle cx="28" cy="25" r="2" fill="#FF6D5A" opacity="0.6"/>
  <circle cx="36" cy="25" r="2" fill="#64748B" opacity="0.4"/>
</svg>