<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Neon Radial Glow -->
    <radialGradient id="glow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#336791" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00758F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Left Glow -->
    <radialGradient id="leftGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#00758F" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="400" height="150" fill="url(#bg)"/>
  <rect width="400" height="150" fill="url(#grid)"/>
  <rect width="400" height="150" fill="url(#glow)"/>
  <rect width="400" height="150" fill="url(#leftGlow)"/>

  <!-- Top Accent Highlight Line -->
  <line x1="0" y1="1" x2="400" y2="1" stroke="#336791" stroke-width="2" opacity="0.4"/>

  <!-- Background Decorative Shapes / Code -->
  
      <!-- Database Cylinders -->
      <g opacity="0.45">
        <ellipse cx="290" cy="40" rx="45" ry="14" fill="#00758F"/>
        <path d="M 245 40 L 245 75 C 245 83, 335 83, 335 75 L 335 40 Z" fill="#336791"/>
        <ellipse cx="290" cy="75" rx="45" ry="14" fill="#00758F"/>
        <path d="M 245 75 L 245 110 C 245 118, 335 118, 335 110 L 335 75 Z" fill="#336791"/>
        <ellipse cx="290" cy="110" rx="45" ry="14" fill="#00758F"/>
      </g>
      <text x="32" y="105" font-family="monospace" font-size="20" font-weight="bold" fill="#38BDF8" opacity="0.9">SELECT * FROM db;</text>
    

  <!-- Tech Dots / Matrix Accents -->
  <circle cx="375" cy="20" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="385" cy="30" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="365" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="20" cy="25" r="2" fill="#336791" opacity="0.6"/>
  <circle cx="28" cy="25" r="2" fill="#00758F" opacity="0.6"/>
  <circle cx="36" cy="25" r="2" fill="#64748B" opacity="0.4"/>
</svg>