<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Neon Radial Glow -->
    <radialGradient id="glow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F05032" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6E40C9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Left Glow -->
    <radialGradient id="leftGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6E40C9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="400" height="150" fill="url(#bg)"/>
  <rect width="400" height="150" fill="url(#grid)"/>
  <rect width="400" height="150" fill="url(#glow)"/>
  <rect width="400" height="150" fill="url(#leftGlow)"/>

  <!-- Top Accent Highlight Line -->
  <line x1="0" y1="1" x2="400" y2="1" stroke="#F05032" stroke-width="2" opacity="0.4"/>

  <!-- Background Decorative Shapes / Code -->
  
      <!-- Git Branch Tree -->
      <circle cx="245" cy="95" r="7" fill="#F05032"/>
      <circle cx="275" cy="95" r="7" fill="#F05032"/>
      <circle cx="315" cy="95" r="7" fill="#F05032"/>
      <line x1="245" y1="95" x2="315" y2="95" stroke="#F05032" stroke-width="3"/>
      
      <circle cx="275" cy="45" r="7" fill="#6E40C9"/>
      <circle cx="315" cy="45" r="7" fill="#6E40C9"/>
      <line x1="275" y1="45" x2="315" y2="45" stroke="#6E40C9" stroke-width="3"/>
      
      <path d="M 245 95 C 260 95, 260 45, 275 45" fill="none" stroke="#6E40C9" stroke-width="3"/>
      <path d="M 315 45 C 330 45, 330 95, 345 95" fill="none" stroke="#F05032" stroke-width="3"/>
      <circle cx="345" cy="95" r="7" fill="#F05032"/>
      <text x="32" y="105" font-family="monospace" font-size="20" font-weight="bold" fill="#FB923C" opacity="0.9">git commit -m</text>
    

  <!-- Tech Dots / Matrix Accents -->
  <circle cx="375" cy="20" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="385" cy="30" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="365" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="20" cy="25" r="2" fill="#F05032" opacity="0.6"/>
  <circle cx="28" cy="25" r="2" fill="#6E40C9" opacity="0.6"/>
  <circle cx="36" cy="25" r="2" fill="#64748B" opacity="0.4"/>
</svg>