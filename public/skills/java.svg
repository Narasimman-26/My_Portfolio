<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Neon Radial Glow -->
    <radialGradient id="glow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E76F00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#5382A1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Left Glow -->
    <radialGradient id="leftGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#5382A1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="400" height="150" fill="url(#bg)"/>
  <rect width="400" height="150" fill="url(#grid)"/>
  <rect width="400" height="150" fill="url(#glow)"/>
  <rect width="400" height="150" fill="url(#leftGlow)"/>

  <!-- Top Accent Highlight Line -->
  <line x1="0" y1="1" x2="400" y2="1" stroke="#E76F00" stroke-width="2" opacity="0.4"/>

  <!-- Background Decorative Shapes / Code -->
  
      <!-- Steaming Java Cup -->
      <path d="M 270 50 Q 280 30 270 15" stroke="#E76F00" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M 285 45 Q 295 25 285 15" stroke="#FF8A00" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
      <path d="M 300 50 Q 310 30 300 15" stroke="#E76F00" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M 255 60 L 315 60 C 315 100, 255 100, 255 60 Z" fill="#5382A1" opacity="0.4"/>
      <path d="M 315 68 C 330 68, 330 85, 312 85" stroke="#5382A1" stroke-width="4" fill="none" opacity="0.6"/>
      <line x1="245" y1="105" x2="325" y2="105" stroke="#E76F00" stroke-width="3" stroke-linecap="round"/>
      <text x="32" y="105" font-family="monospace" font-size="22" font-weight="bold" fill="#E76F00" opacity="0.9">class Backend {</text>
    

  <!-- Tech Dots / Matrix Accents -->
  <circle cx="375" cy="20" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="385" cy="30" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="365" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="20" cy="25" r="2" fill="#E76F00" opacity="0.6"/>
  <circle cx="28" cy="25" r="2" fill="#5382A1" opacity="0.6"/>
  <circle cx="36" cy="25" r="2" fill="#64748B" opacity="0.4"/>
</svg>