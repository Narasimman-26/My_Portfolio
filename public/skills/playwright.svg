<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Neon Radial Glow -->
    <radialGradient id="glow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2EAD33" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#E33A60" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Left Glow -->
    <radialGradient id="leftGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#E33A60" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="400" height="150" fill="url(#bg)"/>
  <rect width="400" height="150" fill="url(#grid)"/>
  <rect width="400" height="150" fill="url(#glow)"/>
  <rect width="400" height="150" fill="url(#leftGlow)"/>

  <!-- Top Accent Highlight Line -->
  <line x1="0" y1="1" x2="400" y2="1" stroke="#2EAD33" stroke-width="2" opacity="0.4"/>

  <!-- Background Decorative Shapes / Code -->
  
      <!-- Browser window with checkmark -->
      <rect x="235" y="30" width="105" height="85" rx="6" fill="#0F172A" stroke="#2EAD33" stroke-width="2" opacity="0.7"/>
      <circle cx="250" cy="42" r="3" fill="#E33A60"/>
      <circle cx="260" cy="42" r="3" fill="#F59E0B"/>
      <circle cx="270" cy="42" r="3" fill="#2EAD33"/>
      <line x1="235" y1="52" x2="340" y2="52" stroke="#2EAD33" stroke-width="1.5"/>
      <path d="M 270 82 L 283 95 L 310 68" fill="none" stroke="#2EAD33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="105" font-family="monospace" font-size="19" font-weight="bold" fill="#4ADE80" opacity="0.9">expect(page).ok()</text>
    

  <!-- Tech Dots / Matrix Accents -->
  <circle cx="375" cy="20" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="385" cy="30" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="365" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="20" cy="25" r="2" fill="#2EAD33" opacity="0.6"/>
  <circle cx="28" cy="25" r="2" fill="#E33A60" opacity="0.6"/>
  <circle cx="36" cy="25" r="2" fill="#64748B" opacity="0.4"/>
</svg>