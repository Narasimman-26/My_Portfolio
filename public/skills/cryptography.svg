<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Neon Radial Glow -->
    <radialGradient id="glow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Left Glow -->
    <radialGradient id="leftGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="400" height="150" fill="url(#bg)"/>
  <rect width="400" height="150" fill="url(#grid)"/>
  <rect width="400" height="150" fill="url(#glow)"/>
  <rect width="400" height="150" fill="url(#leftGlow)"/>

  <!-- Top Accent Highlight Line -->
  <line x1="0" y1="1" x2="400" y2="1" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>

  <!-- Background Decorative Shapes / Code -->
  
      <!-- Crypto Padlock & Binary -->
      <g transform="translate(290, 75)">
        <rect x="-18" y="-6" width="36" height="30" rx="4" fill="#F59E0B" opacity="0.8"/>
        <path d="M -11 -6 L -11 -18 C -11 -28, 11 -28, 11 -18 L 11 -6" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
        <circle cx="0" cy="6" r="3" fill="#07090E"/>
        <line x1="0" y1="9" x2="0" y2="15" stroke="#07090E" stroke-width="2"/>
      </g>
      <text x="32" y="105" font-family="monospace" font-size="20" font-weight="bold" fill="#34D399" opacity="0.9">AES_256_GCM</text>
    

  <!-- Tech Dots / Matrix Accents -->
  <circle cx="375" cy="20" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="385" cy="30" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="365" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="20" cy="25" r="2" fill="#F59E0B" opacity="0.6"/>
  <circle cx="28" cy="25" r="2" fill="#10B981" opacity="0.6"/>
  <circle cx="36" cy="25" r="2" fill="#64748B" opacity="0.4"/>
</svg>