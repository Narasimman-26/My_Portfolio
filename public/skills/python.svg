<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Neon Radial Glow -->
    <radialGradient id="glow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3776AB" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFD438" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Left Glow -->
    <radialGradient id="leftGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#FFD438" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="400" height="150" fill="url(#bg)"/>
  <rect width="400" height="150" fill="url(#grid)"/>
  <rect width="400" height="150" fill="url(#glow)"/>
  <rect width="400" height="150" fill="url(#leftGlow)"/>

  <!-- Top Accent Highlight Line -->
  <line x1="0" y1="1" x2="400" y2="1" stroke="#3776AB" stroke-width="2" opacity="0.4"/>

  <!-- Background Decorative Shapes / Code -->
  
      <!-- Python snakes abstract -->
      <path d="M 230 45 C 230 30, 260 30, 275 30 L 305 30 C 320 30, 335 45, 335 60 L 335 85 L 290 85 C 275 85, 265 95, 265 110 L 265 125 L 245 125 C 230 125, 215 110, 215 95 L 215 70 C 215 55, 230 45, 230 45 Z" fill="#3776AB" opacity="0.35"/>
      <path d="M 330 115 C 330 130, 300 130, 285 130 L 255 130 C 240 130, 225 115, 225 100 L 225 75 L 270 75 C 285 75, 295 65, 295 50 L 295 35 L 315 35 C 330 35, 345 50, 345 65 L 345 90 C 345 105, 330 115, 330 115 Z" fill="#FFD438" opacity="0.35"/>
      <circle cx="250" cy="50" r="4" fill="#FFD438"/>
      <circle cx="310" cy="110" r="4" fill="#3776AB"/>
      <!-- Terminal code tags -->
      <text x="32" y="105" font-family="monospace" font-size="28" font-weight="bold" fill="#FFD438" opacity="0.9">&gt;&gt;&gt;</text>
      <text x="95" y="105" font-family="monospace" font-size="20" font-weight="bold" fill="#E2E8F0" opacity="0.9">import sys, os</text>
    

  <!-- Tech Dots / Matrix Accents -->
  <circle cx="375" cy="20" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="385" cy="30" r="1.5" fill="#ffffff" opacity="0.2"/>
  <circle cx="365" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="20" cy="25" r="2" fill="#3776AB" opacity="0.6"/>
  <circle cx="28" cy="25" r="2" fill="#FFD438" opacity="0.6"/>
  <circle cx="36" cy="25" r="2" fill="#64748B" opacity="0.4"/>
</svg>